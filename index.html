<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>For Dino ❤️</title>
  <style>
    body {
      margin:0; padding:0;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      background: radial-gradient(circle at top, #0b032d, #030010);
      overflow:hidden;
      color:#fff;
      font-family: 'Courier New', monospace;
    }
    .container {
      background: rgba(0,0,0,0.5);
      padding:30px;
      border-radius:10px;
      box-shadow:0 0 20px rgba(255,255,255,0.2);
      max-width:600px;
      text-align:left;
    }
    #message {
      font-size:1.5rem;
      white-space:pre-wrap;
      line-height:1.3;
    }
    #cursor {
      display:inline-block;
      width:10px;
      background:#fff;
      margin-left:2px;
      animation: blink 0.8s infinite;
    }
    @keyframes blink {
      0%,100% {opacity:1}
      50% {opacity:0}
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="message"></div><span id="cursor"></span>
  </div>

  <script>
    const text = "Dear Dino,\n\nI Love You ❤️\n\nLove,\n[Your Bro]"; 
    // यहाँ [Your Bro] अपनी जगह लिखना
    const el = document.getElementById('message');
    let idx = 0;

    function typeChar() {
      if (idx < text.length) {
        el.textContent += text[idx++];
        setTimeout(typeChar, 120);
      } else {
        document.getElementById('cursor').style.display = 'none';
        // नीचे optional बाहर animation या image ला सकते हो
      }
    }

    window.onload = typeChar;
  </script>

</body>
</html>
